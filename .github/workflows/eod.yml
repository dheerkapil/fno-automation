name: NSE EOD F&O to Telegram

# 19:40 IST = 14:10 UTC. NSE usually publishes the UDiFF bhavcopy by ~18:30-19:00 IST.
# The job waits up to 20 minutes for a late file, so one run is normally enough.
permissions:
  contents: write          # lets the job append the history shard and push it

on:
  schedule:
    - cron: "10 14 * * 1-5"
  workflow_dispatch:          # lets you re-run by hand from the Actions tab

jobs:
  eod:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull NSE EOD, compute sheets, deliver to Telegram
        env:
          # TELEGRAM_BOT_TOKEN is the name used in the other repos on this account;
          # TELEGRAM_TOKEN is still honoured as a fallback by the script.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FNO_THRESHOLD: "0.08"      # OI-change gate for LB/SB/SC/LU (0.08 = 8%)
        run: python fno_eod.py --days 20 --wait 20 --telegram --out out

      # Keep the long-run history current: adds data/history/<date>.csv.gz
      - name: Update history
        if: always()
        run: python backfill.py --since-last

      - name: Commit history shard
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history 2>/dev/null || true
          git diff --cached --quiet || git commit -m "History: $(date -u +%F)"
          git push || true

      # Optional: keep the day's files as a 7-day artifact (no repo storage used).
      # Delete this block if you want a strictly zero-storage setup.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fno-eod
          path: out/
          retention-days: 7
          if-no-files-found: ignore

      # Tells you on Telegram if the run died, instead of you noticing silence.
      - name: Notify failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN:-$TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="NSE EOD run failed - ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
